# Prod copy: rename app to greenroom-api and change the hostnames in the README.
app = "greenroom-staging-api"
primary_region = "iad"

[build]
dockerfile = "../../apps/api/Dockerfile"

[env]
NODE_ENV = "production"
INTEGRATIONS_MODE = "fake"
API_PORT = "4000"
WEB_URL = "https://staging.greenroom.fyi"
WEB_ORIGIN = "https://staging.greenroom.fyi"
API_PUBLIC_URL = "https://api.staging.greenroom.fyi"
SESSION_COOKIE_NAME = "gr_staging_session"
COOKIE_DOMAIN = "staging.greenroom.fyi"

[deploy]
release_command = "node packages/db/dist/migrate-cli.js"

[http_service]
internal_port = 4000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
method = "GET"
path = "/health"
interval = "30s"
timeout = "5s"
grace_period = "20s"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
