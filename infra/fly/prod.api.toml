app = "greenroom-api"
primary_region = "iad"

[build]
dockerfile = "../../apps/api/Dockerfile"

[env]
NODE_ENV = "production"
INTEGRATIONS_MODE = "real"
API_PORT = "4000"
WEB_URL = "https://greenroom.fyi"
WEB_ORIGIN = "https://greenroom.fyi"
API_PUBLIC_URL = "https://api.greenroom.fyi"
SESSION_COOKIE_NAME = "gr_session"
COOKIE_DOMAIN = "greenroom.fyi"

[deploy]
release_command = "node packages/db/dist/migrate-cli.js"

[http_service]
internal_port = 4000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
method = "GET"
path = "/health"
interval = "30s"
timeout = "5s"
grace_period = "20s"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
