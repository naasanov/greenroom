# Prod copy: rename app to greenroom-web and set NEXT_PUBLIC_API_URL to https://api.greenroom.fyi.
app = "greenroom-staging-web"
primary_region = "iad"

[build]
dockerfile = "../../apps/web/Dockerfile"

[build.args]
NEXT_PUBLIC_API_URL = "https://api.staging.greenroom.fyi"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
