services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenroom
      POSTGRES_PASSWORD: greenroom
      POSTGRES_DB: greenroom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenroom -d greenroom"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
