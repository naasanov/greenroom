name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "memory/**"
      - "CLAUDE.md"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "memory/**"
      - "CLAUDE.md"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Migration journal unit tests
        run: node --test scripts/check-migration-journal.test.mjs
      - name: Check migration journal against base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          node scripts/check-migration-journal.mjs --base "origin/${BASE_REF}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - name: Ultimate Guitar live check (early warning)
        continue-on-error: true
        run: node apps/api/dist/integrations/__checks__/ultimate-guitar-live.js
      - name: Verify e2e shard plan covers every spec
        run: node apps/e2e/scripts/run-shard.mjs --verify

  e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    # Image tag must match the installed @playwright/test version.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Mobile (WebKit) is slower per test, so it gets more shards. Counts must
        # match apps/e2e/shard-plan.json (checked by run-shard.mjs --verify).
        include:
          - { project: desktop, shard: 1, total: 3 }
          - { project: desktop, shard: 2, total: 3 }
          - { project: desktop, shard: 3, total: 3 }
          - { project: mobile, shard: 1, total: 5 }
          - { project: mobile, shard: 2, total: 5 }
          - { project: mobile, shard: 3, total: 5 }
          - { project: mobile, shard: 4, total: 5 }
          - { project: mobile, shard: 5, total: 5 }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: greenroom
          POSTGRES_PASSWORD: greenroom
          POSTGRES_DB: greenroom_test
        options: >-
          --health-cmd "pg_isready -U greenroom -d greenroom_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://greenroom:greenroom@postgres:5432/greenroom_test
      # The service container host is `postgres`, not localhost.
      ALLOW_REMOTE_DB: 1
      E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run e2e shard
        shell: bash
        run: |
          FILES=$(node apps/e2e/scripts/run-shard.mjs --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total }})
          if [ -z "$FILES" ]; then echo "No spec files in this shard"; exit 0; fi
          # Quarantined tests (apps/e2e/quarantine.json) run in the non-blocking job below.
          SKIP=$(node apps/e2e/scripts/run-shard.mjs --project=${{ matrix.project }} --quarantined=grep)
          ARGS=(--project=${{ matrix.project }} $FILES --reporter=github,html,json)
          if [ -n "$SKIP" ]; then ARGS+=("--grep-invert=$SKIP"); fi
          pnpm test:e2e -- "${ARGS[@]}"
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/timings.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.project }}-${{ matrix.shard }}
          path: timings.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  # Known-flaky tests (apps/e2e/quarantine.json). Failures show as this check but never fail the workflow.
  e2e-quarantine:
    name: e2e quarantine (${{ matrix.project }})
    runs-on: ubuntu-latest
    continue-on-error: true
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: greenroom
          POSTGRES_PASSWORD: greenroom
          POSTGRES_DB: greenroom_test
        options: >-
          --health-cmd "pg_isready -U greenroom -d greenroom_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://greenroom:greenroom@postgres:5432/greenroom_test
      # The service container host is `postgres`, not localhost.
      ALLOW_REMOTE_DB: 1
      E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run quarantined e2e tests (one retry)
        id: quarantine
        continue-on-error: true
        shell: bash
        run: |
          FILES=$(node apps/e2e/scripts/run-shard.mjs --project=${{ matrix.project }} --quarantined=files)
          GREP=$(node apps/e2e/scripts/run-shard.mjs --project=${{ matrix.project }} --quarantined=grep)
          if [ -z "$FILES" ]; then echo "Nothing quarantined for this project"; exit 0; fi
          pnpm test:e2e -- --project=${{ matrix.project }} $FILES "--grep=$GREP" --retries=1 --reporter=github,html
      - name: Flag quarantine failure
        if: steps.quarantine.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::quarantined e2e specs failed (${{ matrix.project }}), non-blocking"
          echo "Quarantined e2e specs failed (${{ matrix.project }}), non-blocking." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-quarantine-report-${{ matrix.project }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
